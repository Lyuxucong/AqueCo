name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install Bioconductor and GitHub dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("BiocManager", "remotes"))

          BiocManager::install(
            "microbiomeMarker",
            ask = FALSE,
            update = FALSE
          )

          remotes::install_github(
            "Hy4m/linkET",
            dependencies = FALSE,
            upgrade = "never"
          )

      - name: Install remaining dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check AqueCo package
        run: rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error")
        shell: Rscript {0}